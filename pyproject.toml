[project]
name = "racing-ai"
version = "0.1.0"
description = "Comparing GA, PPO and GA->PPO hybrid training for 2D racing agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
